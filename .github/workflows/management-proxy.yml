name: Management Proxy

on:
  pull_request:
    paths:
      - management-proxy/**
      - .github/workflows/management-proxy.yml
  push:
    branches:
      - main
    paths:
      - management-proxy/**
      - .github/workflows/management-proxy.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1 --verify=false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: management-proxy/test/go.mod
          cache-dependency-path: management-proxy/test/go.sum

      - name: Install kubeconform and kube-linter
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          KUBE_LINTER_VERSION: "0.8.3"
          KUBE_LINTER_SHA256: 1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo kube-linter.tar.gz \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          printf '%s  kubeconform.tar.gz\n%s  kube-linter.tar.gz\n' "$KUBECONFORM_SHA256" "$KUBE_LINTER_SHA256" | sha256sum -c -
          sudo tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
          sudo tar -xzf kube-linter.tar.gz -C /usr/local/bin kube-linter

      # The runner image provides yq, curl, shellcheck and Docker.
      - name: Lint
        run: make -C management-proxy lint

      - name: Test the Envoy configuration and the sidecar
        run: make -C management-proxy test
