name: Markdown Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rumdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: rvben/rumdl@19006897519812a2fdc508314b34738e5c281233 # v0.3.0
        with:
          version: "0.3.0"
          report-type: annotations
