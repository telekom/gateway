# Value profile: existing Secrets, a separate Secret with the CA certificate that verifies the sidecar, two issuers
# of caller tokens, no request binding, no egress policy.
allowedClients: [dcp-client, other-client]
envoy:
  gatewayToken:
    issuer: https://issuer.example.com/realms/default
    requestBinding: false
    jwks:
      uri: https://issuer.example.com:8443/realms/default/certs
tls:
  certManager:
    enabled: false
  serverCertificate:
    secretName: management-proxy-tls
    caSecretName: management-proxy-ca
rbac:
  namespaces: [routes-a, routes-b]
networkPolicy:
  egress:
    enabled: false
route:
  parentRefs:
    - name: gateway
  jwtExtensionRef:
    name: caller-jwt
  extProcExtensionRef:
    name: gateway-token
  issuers:
    - issuer: https://idp.example.com/realms/default
    - issuer: https://other-idp.example.com/realms/default
      clientClaim: azp
      clients: [other-client]
